<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" role="img" aria-labelledby="title desc">
  <title id="title">Three-dimensional illustrated ringed planet</title>
  <desc id="desc">A luminous amber and lavender planet wrapped in dramatic golden rings.</desc>
  <defs>
    <radialGradient id="halo"><stop stop-color="#8db9ff" stop-opacity=".29"/><stop offset=".62" stop-color="#4973dc" stop-opacity=".13"/><stop offset="1" stop-color="#4973dc" stop-opacity="0"/></radialGradient>
    <radialGradient id="planet" cx=".31" cy=".20" r=".84">
      <stop stop-color="#fff5dc"/><stop offset=".23" stop-color="#f6d9a5"/><stop offset=".46" stop-color="#d3a47e"/><stop offset=".72" stop-color="#90748f"/><stop offset=".89" stop-color="#384774"/><stop offset="1" stop-color="#182447"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#cceaff" stop-opacity=".43"/><stop offset=".21" stop-color="#fff5ce" stop-opacity=".85"/><stop offset=".48" stop-color="#f5c689"/><stop offset=".74" stop-color="#b6a3d7"/><stop offset="1" stop-color="#718cd6" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="ringFront" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#d2d7ff" stop-opacity=".5"/><stop offset=".23" stop-color="#fff1b7"/><stop offset=".53" stop-color="#e9b878"/><stop offset=".8" stop-color="#a9a9df"/><stop offset="1" stop-color="#91bbfa" stop-opacity=".64"/>
    </linearGradient>
    <linearGradient id="bands" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffe4b7" stop-opacity=".3"/><stop offset=".42" stop-color="#c98e81" stop-opacity=".11"/><stop offset=".62" stop-color="#ffe8ba" stop-opacity=".21"/><stop offset="1" stop-color="#42395d" stop-opacity=".35"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="221" cy="196" r="109"/></clipPath>
    <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="shine" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <circle cx="219" cy="201" r="189" fill="url(#halo)"/>
  <ellipse cx="220" cy="310" rx="99" ry="17" fill="#000d25" opacity=".42" filter="url(#shadow)"/>
  <!-- Ring is drawn behind the globe, with front-half arcs added after it. -->
  <ellipse cx="220" cy="194" rx="190" ry="72" transform="rotate(-22 220 194)" fill="none" stroke="url(#ring)" stroke-width="24" opacity=".74"/>
  <ellipse cx="220" cy="194" rx="188" ry="71" transform="rotate(-22 220 194)" fill="none" stroke="#ffe6b7" stroke-opacity=".48" stroke-width="2"/>
  <ellipse cx="220" cy="194" rx="168" ry="58" transform="rotate(-22 220 194)" fill="none" stroke="#f8d8ab" stroke-opacity=".34" stroke-width="4"/>
  <circle cx="224" cy="203" r="111" fill="#051532" opacity=".4" filter="url(#shadow)"/>
  <circle cx="221" cy="196" r="109" fill="url(#planet)"/>
  <g clip-path="url(#disc)">
    <path d="M102 146Q205 179 335 135" stroke="#fdf0ca" stroke-opacity=".15" stroke-width="18" fill="none"/>
    <path d="M100 178Q202 205 338 166" stroke="#8d6279" stroke-opacity=".22" stroke-width="23" fill="none"/>
    <path d="M112 213Q214 245 323 212" stroke="#ffe1ad" stroke-opacity=".23" stroke-width="13" fill="none"/>
    <path d="M115 247Q211 263 326 246" stroke="#d4b2ad" stroke-opacity=".17" stroke-width="17" fill="none"/>
    <circle cx="221" cy="196" r="109" fill="url(#bands)" opacity=".55"/>
    <ellipse cx="181" cy="144" rx="48" ry="27" transform="rotate(-26 181 144)" fill="#fffbe2" opacity=".28" filter="url(#shine)"/>
    <path d="M275 110Q353 195 266 294L325 303 347 115Z" fill="#121b45" opacity=".26"/>
  </g>
  <circle cx="221" cy="196" r="109" fill="none" stroke="#fff3d6" stroke-opacity=".3" stroke-width="1.5"/>
  <!-- Forward half of the orbital ring and multiple delicate ring bands. -->
  <path d="M397 120 C 420 164 338 273 225 292 C 118 310 36 272 42 243" fill="none" stroke="#141e4e" stroke-opacity=".45" stroke-width="28"/>
  <path d="M397 120 C 420 164 338 273 225 292 C 118 310 36 272 42 243" fill="none" stroke="url(#ringFront)" stroke-width="23" stroke-linecap="round" opacity=".91"/>
  <path d="M396 116 C 414 161 332 260 222 280 C 125 297 44 268 43 243" fill="none" stroke="#fff5d8" stroke-width="2.1" stroke-opacity=".77"/>
  <path d="M397 126 C 418 173 344 280 227 301 C 112 317 36 277 42 252" fill="none" stroke="#c6d8ff" stroke-width="2.6" stroke-opacity=".47"/>
  <circle cx="79" cy="95" r="3.5" fill="#d2f0ff" opacity=".86"/>
  <circle cx="338" cy="65" r="2.5" fill="#fff1ca" opacity=".9"/>
  <circle cx="368" cy="307" r="3" fill="#b5dfff" opacity=".7"/>
</svg>